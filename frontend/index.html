<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beatrice Dataset Studio: build clean, transcribed voice datasets for the Beatrice trainer, RVC and TTS." />
    <meta name="theme-color" content="#000000" />
    <title>Beatrice Dataset Studio</title>
    <script>
      // Apply the saved (or system) colour mode before first paint.
      (function () {
        var mode = null
        try { mode = localStorage.getItem('beatrice-dataset-color-mode') } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-color-mode', mode)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
